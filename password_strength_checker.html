<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .password-box {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        .show-btn {
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .strength-bar {
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        #strength {
            height: 100%;
            width: 0;
            transition: 0.3s;
        }

        #strengthText {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }

        .requirements {
            margin-top: 20px;
        }

        .requirements p {
            margin: 8px 0;
            color: #777;
        }

        .valid {
            color: green !important;
        }

        .invalid {
            color: red !important;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Password Strength Checker</h2>

        <label for="password">Enter Password</label>

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                oninput="checkPassword()"
            >

            <button class="show-btn" onclick="togglePassword()">
                Show
            </button>
        </div>

        <div class="strength-bar">
            <div id="strength"></div>
        </div>

        <div id="strengthText">
            Enter a password
        </div>

        <div class="requirements">

            <p id="length">❌ At least 8 characters</p>

            <p id="uppercase">❌ One uppercase letter</p>

            <p id="lowercase">❌ One lowercase letter</p>

            <p id="number">❌ One number</p>

            <p id="special">❌ One special character</p>

        </div>

    </div>


    <script>

        const password = document.getElementById("password");
        const strength = document.getElementById("strength");
        const strengthText = document.getElementById("strengthText");


        function checkPassword() {

            let value = password.value;

            let score = 0;


            // Check length
            if (value.length >= 8) {
                score++;
                document.getElementById("length").innerText =
                    "✅ At least 8 characters";
                document.getElementById("length").className = "valid";
            } else {
                document.getElementById("length").innerText =
                    "❌ At least 8 characters";
                document.getElementById("length").className = "invalid";
            }


            // Check uppercase
            if (/[A-Z]/.test(value)) {
                score++;
                document.getElementById("uppercase").innerText =
                    "✅ One uppercase letter";
                document.getElementById("uppercase").className = "valid";
            } else {
                document.getElementById("uppercase").innerText =
                    "❌ One uppercase letter";
                document.getElementById("uppercase").className = "invalid";
            }


            // Check lowercase
            if (/[a-z]/.test(value)) {
                score++;
                document.getElementById("lowercase").innerText =
                    "✅ One lowercase letter";
                document.getElementById("lowercase").className = "valid";
            } else {
                document.getElementById("lowercase").innerText =
                    "❌ One lowercase letter";
                document.getElementById("lowercase").className = "invalid";
            }


            // Check number
            if (/[0-9]/.test(value)) {
                score++;
                document.getElementById("number").innerText =
                    "✅ One number";
                document.getElementById("number").className = "valid";
            } else {
                document.getElementById("number").innerText =
                    "❌ One number";
                document.getElementById("number").className = "invalid";
            }


            // Check special character
            if (/[^A-Za-z0-9]/.test(value)) {
                score++;
                document.getElementById("special").innerText =
                    "✅ One special character";
                document.getElementById("special").className = "valid";
            } else {
                document.getElementById("special").innerText =
                    "❌ One special character";
                document.getElementById("special").className = "invalid";
            }


            // Strength calculation
            if (value.length === 0) {

                strength.style.width = "0%";
                strengthText.innerText = "Enter a password";

            } else if (score <= 2) {

                strength.style.width = "33%";
                strengthText.innerText = "Weak";

            } else if (score <= 4) {

                strength.style.width = "66%";
                strengthText.innerText = "Medium";

            } else {

                strength.style.width = "100%";
                strengthText.innerText = "Strong";
            }

        }


        function togglePassword() {

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";
            }
        }

    </script>

</body>
</html>
