<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word & Character Counter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .container {
            width: 600px;
            max-width: 100%;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;

            padding: 18px;

            border: 2px solid #ddd;

            border-radius: 12px;

            font-size: 17px;
            line-height: 1.6;

            resize: vertical;

            outline: none;

            font-family: Arial, sans-serif;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .stats {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;

            margin-top: 20px;
        }

        .stat {
            padding: 18px 10px;

            text-align: center;

            background: #f5f6fa;

            border-radius: 12px;
        }

        .stat-number {
            display: block;

            font-size: 25px;

            font-weight: bold;

            color: #667eea;

            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;

            color: #666;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        button {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #clearBtn {
            background: #ff4757;
            color: white;
        }

        #copyBtn {
            background: #667eea;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            min-height: 20px;

            color: #27ae60;

            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                padding: 22px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 Word & Character Counter</h1>

        <p class="subtitle">
            Start typing to see your text statistics
        </p>


        <textarea
            id="textInput"
            placeholder="Type or paste your text here..."
        ></textarea>


        <div class="stats">

            <div class="stat">

                <span
                    class="stat-number"
                    id="wordCount"
                >
                    0
                </span>

                <span class="stat-label">
                    Words
                </span>

            </div>


            <div class="stat">

                <span
                    class="stat-number"
                    id="charCount"
                >
                    0
                </span>

                <span class="stat-label">
                    Characters
                </span>

            </div>


            <div class="stat">

                <span
                    class="stat-number"
                    id="charNoSpace"
                >
                    0
                </span>

                <span class="stat-label">
                    Without Spaces
                </span>

            </div>


            <div class="stat">

                <span
                    class="stat-number"
                    id="lineCount"
                >
                    0
                </span>

                <span class="stat-label">
                    Lines
                </span>

            </div>

        </div>


        <div class="buttons">

            <button id="copyBtn">
                📋 Copy Text
            </button>

            <button id="clearBtn">
                🗑️ Clear
            </button>

        </div>


        <div id="message"></div>

    </div>


    <script>

        const textInput =
            document.getElementById("textInput");

        const wordCount =
            document.getElementById("wordCount");

        const charCount =
            document.getElementById("charCount");

        const charNoSpace =
            document.getElementById("charNoSpace");

        const lineCount =
            document.getElementById("lineCount");

        const copyBtn =
            document.getElementById("copyBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const message =
            document.getElementById("message");


        // Update all counters
        function updateCounter() {

            const text = textInput.value;


            // Character count
            charCount.innerText =
                text.length;


            // Character count without spaces
            charNoSpace.innerText =
                text.replace(/\s/g, "").length;


            // Word count
            const trimmedText = text.trim();

            if (trimmedText === "") {

                wordCount.innerText = "0";

            } else {

                const words =
                    trimmedText.split(/\s+/);

                wordCount.innerText =
                    words.length;
            }


            // Line count
            if (text === "") {

                lineCount.innerText = "0";

            } else {

                lineCount.innerText =
                    text.split("\n").length;
            }

        }


        // Update counter while typing
        textInput.addEventListener(
            "input",
            updateCounter
        );


        // Copy text
        copyBtn.addEventListener("click", function() {

            const text = textInput.value;


            if (text.trim() === "") {

                message.innerText =
                    "⚠️ There is no text to copy.";

                return;
            }


            navigator.clipboard.writeText(text)
                .then(function() {

                    message.innerText =
                        "✅ Text copied successfully!";

                });

        });


        // Clear text
        clearBtn.addEventListener("click", function() {

            textInput.value = "";

            updateCounter();

            message.innerText =
                "🗑️ Text cleared.";

            textInput.focus();

        });

    </script>

</body>
</html>
