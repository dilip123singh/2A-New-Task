<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Preview Before Upload</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 450px;
            max-width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            background: #f8f9ff;
        }

        .upload-box label {
            display: inline-block;
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .upload-box label:hover {
            background: #5568d8;
        }

        #imageInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
        }

        .preview-container h3 {
            margin-bottom: 12px;
            color: #333;
        }

        #previewImage {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid #ddd;
            background: #f5f5f5;
        }

        #fileName {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            word-break: break-word;
        }

        .remove-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        #errorMessage {
            display: none;
            color: #e74c3c;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Image Preview</h1>

        <p class="description">
            Select an image to see its preview before uploading.
        </p>

        <div class="upload-box">

            <label for="imageInput">
                Choose Image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </div>

        <div id="errorMessage"></div>


        <div class="preview-container" id="previewContainer">

            <h3>Image Preview</h3>

            <img
                id="previewImage"
                src=""
                alt="Selected image preview"
            >

            <p id="fileName"></p>

            <button
                type="button"
                class="remove-btn"
                id="removeBtn"
            >
                Remove Image
            </button>

        </div>

    </div>


    <script>

        const imageInput =
            document.getElementById("imageInput");

        const previewImage =
            document.getElementById("previewImage");

        const previewContainer =
            document.getElementById("previewContainer");

        const fileName =
            document.getElementById("fileName");

        const removeBtn =
            document.getElementById("removeBtn");

        const errorMessage =
            document.getElementById("errorMessage");


        imageInput.addEventListener("change", function() {

            const file = imageInput.files[0];

            // Clear previous error
            errorMessage.style.display = "none";
            errorMessage.textContent = "";


            // Check if file is selected
            if (!file) {
                return;
            }


            // Check whether selected file is an image
            if (!file.type.startsWith("image/")) {

                errorMessage.textContent =
                    "Please select a valid image file.";

                errorMessage.style.display = "block";

                imageInput.value = "";

                return;
            }


            // Create temporary URL for selected image
            const imageURL =
                URL.createObjectURL(file);


            // Display image
            previewImage.src = imageURL;

            // Display file name
            fileName.textContent =
                "Selected: " + file.name;


            // Show preview container
            previewContainer.style.display = "block";

        });


        removeBtn.addEventListener("click", function() {

            // Clear selected file
            imageInput.value = "";

            // Remove preview
            previewImage.src = "";

            // Hide preview
            previewContainer.style.display = "none";

            // Clear filename
            fileName.textContent = "";

        });

    </script>

</body>
</html>
