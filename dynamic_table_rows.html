<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Table Rows</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
        }

        .add-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #5568d9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .remove-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            background: #dc3545;
            color: white;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #bb2d3b;
        }

        #message {
            text-align: center;
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        @media (max-width: 700px) {

            .form {
                grid-template-columns: 1fr;
            }

            .add-btn {
                width: 100%;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Student Table</h1>

        <div class="form">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <input
                type="number"
                id="marks"
                placeholder="Marks"
                min="0"
                max="100"
            >

            <button class="add-btn" onclick="addRow()">
                + Add Student
            </button>

        </div>


        <div id="message"></div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable">

                    <tr>
                        <td>1</td>
                        <td>Dilip</td>
                        <td>B.Com IT</td>
                        <td>85</td>
                        <td>
                            <button
                                class="remove-btn"
                                onclick="removeRow(this)">
                                Remove
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script>

        let studentTable =
            document.getElementById("studentTable");

        let nameInput =
            document.getElementById("name");

        let courseInput =
            document.getElementById("course");

        let marksInput =
            document.getElementById("marks");

        let message =
            document.getElementById("message");


        // Add new row
        function addRow() {

            let name = nameInput.value.trim();
            let course = courseInput.value.trim();
            let marks = marksInput.value.trim();


            // Validation
            if (name === "" || course === "" || marks === "") {

                message.innerText =
                    "Please fill all fields.";

                message.className = "error";

                return;
            }


            if (marks < 0 || marks > 100) {

                message.innerText =
                    "Marks must be between 0 and 100.";

                message.className = "error";

                return;
            }


            // Create new row
            let row =
                document.createElement("tr");


            // Get current row number
            let rowNumber =
                studentTable.rows.length + 1;


            row.innerHTML = `
                <td>${rowNumber}</td>

                <td>${name}</td>

                <td>${course}</td>

                <td>${marks}</td>

                <td>
                    <button
                        class="remove-btn"
                        onclick="removeRow(this)">
                        Remove
                    </button>
                </td>
            `;


            // Add row to table
            studentTable.appendChild(row);


            // Clear inputs
            nameInput.value = "";
            courseInput.value = "";
            marksInput.value = "";


            message.innerText =
                "✓ Student added successfully.";

            message.className = "success";


            updateRowNumbers();
        }


        // Remove row
        function removeRow(button) {

            // Find the row containing the button
            let row = button.parentElement.parentElement;


            // Remove row
            row.remove();


            // Update numbers
            updateRowNumbers();


            message.innerText =
                "✓ Student removed.";

            message.className = "success";
        }


        // Update serial numbers
        function updateRowNumbers() {

            let rows = studentTable.rows;

            for (let i = 0; i < rows.length; i++) {

                rows[i].cells[0].innerText = i + 1;

            }
        }

    </script>

</body>
</html>
