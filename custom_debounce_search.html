<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Debounce Search</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f3f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 450px;
            max-width: 90%;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #212529;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #searchInput {
            width: 100%;
            padding: 14px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #0d6efd;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            background: #e9ecef;
            border-radius: 8px;
            color: #333;
        }

        #results {
            margin-top: 15px;
        }

        .result {
            padding: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-left: 4px solid #0d6efd;
            border-radius: 4px;
        }

        .no-result {
            color: #dc3545;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Search</h1>

        <p class="description">
            Type something. Search runs only after you stop typing.
        </p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            autocomplete="off"
        >

        <div id="status">
            Start typing...
        </div>

        <div id="results"></div>

    </div>


    <script>

        // Sample data
        const products = [
            "Java Programming",
            "JavaScript Course",
            "HTML and CSS",
            "Bootstrap",
            "Python Programming",
            "React JS",
            "Node JS",
            "MySQL Database",
            "Git and GitHub",
            "Data Structures"
        ];


        // ========================================
        // CUSTOM DEBOUNCE FUNCTION
        // ========================================

        function debounce(callback, delay) {

            let timer;

            return function (...args) {

                // Clear previous timer
                clearTimeout(timer);

                // Start a new timer
                timer = setTimeout(function () {

                    callback(...args);

                }, delay);
            };
        }


        // ========================================
        // SEARCH FUNCTION
        // ========================================

        function searchProducts(searchText) {

            const results = document.getElementById("results");
            const status = document.getElementById("status");

            const text = searchText.trim().toLowerCase();

            results.innerHTML = "";

            if (text === "") {
                status.textContent = "Start typing...";
                return;
            }

            const filteredProducts = products.filter(function (product) {

                return product.toLowerCase().includes(text);

            });


            status.textContent =
                "Search executed for: " + searchText;


            if (filteredProducts.length === 0) {

                results.innerHTML =
                    '<p class="no-result">No products found.</p>';

                return;
            }


            filteredProducts.forEach(function (product) {

                const div = document.createElement("div");

                div.className = "result";

                div.textContent = product;

                results.appendChild(div);

            });
        }


        // ========================================
        // CREATE DEBOUNCED SEARCH
        // ========================================

        const debouncedSearch = debounce(searchProducts, 500);


        // ========================================
        // SEARCH INPUT EVENT
        // ========================================

        const searchInput = document.getElementById("searchInput");

        searchInput.addEventListener("input", function () {

            const value = searchInput.value;

            document.getElementById("status").textContent =
                "Typing...";

            // Call debounced function
            debouncedSearch(value);

        });

    </script>

</body>
</html>
