
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid #bfdbfe;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            font-weight: normal;
        }

        .radio-group input {
            width: auto;
            margin-right: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        /* HTML5 validation styling */

        input:invalid,
        select:invalid {
            border-color: #ef4444;
        }

        input:valid,
        select:valid {
            border-color: #22c55e;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Event Registration</h1>

        <p class="description">
            Register for our upcoming technology event.
        </p>


        <form>


            <!-- Full Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    pattern="[A-Za-z ]{3,50}"
                    title="Name should contain only letters and spaces"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required>

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="9876543210"
                    pattern="[0-9]{10}"
                    title="Enter a 10-digit phone number"
                    required>

            </div>


            <!-- Age -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="16"
                    max="60"
                    required>

            </div>


            <!-- Event Date -->

            <div class="form-group">

                <label for="date">
                    Event Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required>

            </div>


            <!-- Event Type -->

            <div class="form-group">

                <label for="event">
                    Select Event
                </label>

                <select
                    id="event"
                    name="event"
                    required>

                    <option value="">
                        -- Select Event --
                    </option>

                    <option value="web">
                        Web Development
                    </option>

                    <option value="java">
                        Java Workshop
                    </option>

                    <option value="ai">
                        AI & Machine Learning
                    </option>

                    <option value="cyber">
                        Cyber Security
                    </option>

                </select>

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label>
                    Gender
                </label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                            required>
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other">
                        Other
                    </label>

                </div>

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required></textarea>

            </div>


            <!-- Terms -->

            <div class="form-group">

                <label>
                    <input
                        type="checkbox"
                        name="terms"
                        required>

                    I agree to the terms and conditions.
                </label>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="submit-btn">

                Register Now

            </button>


        </form>

    </div>


</body>

</html>
