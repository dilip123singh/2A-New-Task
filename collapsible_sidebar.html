<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collapsible Sidebar</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background-color: #f5f7fb;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            transition: width 0.3s ease;
        }

        /* Collapsed Sidebar */
        .sidebar.collapsed {
            width: 75px;
        }

        /* Sidebar Links */
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        .sidebar .nav-link i {
            font-size: 20px;
            min-width: 30px;
        }

        /* Hide Text when collapsed */
        .sidebar.collapsed .menu-text,
        .sidebar.collapsed .logo-text {
            display: none;
        }

        /* Center icons when collapsed */
        .sidebar.collapsed .nav-link {
            text-align: center;
            padding-left: 10px;
            padding-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            transition: margin-left 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 75px;
        }

        /* Mobile */
        @media (max-width: 767px) {

            .sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                z-index: 1050;
                transition: left 0.3s ease;
            }

            .sidebar.mobile-show {
                left: 0;
            }

            .main-content,
            .main-content.expanded {
                margin-left: 0;
            }

        }
    </style>
</head>

<body>


    <!-- ================= SIDEBAR ================= -->

    <aside
        id="sidebar"
        class="sidebar bg-dark text-white position-fixed top-0 start-0 p-3"
    >

        <!-- Logo -->
        <div
            class="d-flex align-items-center justify-content-between
                   mb-4"
        >

            <h4 class="fw-bold mb-0">

                <i class="bi bi-grid-fill"></i>

                <span class="logo-text ms-2">
                    Admin
                </span>

            </h4>

        </div>


        <hr class="text-secondary">


        <!-- Menu -->
        <nav>

            <a href="#" class="nav-link active">

                <i class="bi bi-house-door-fill"></i>

                <span class="menu-text ms-2">
                    Dashboard
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-people-fill"></i>

                <span class="menu-text ms-2">
                    Users
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-box-seam-fill"></i>

                <span class="menu-text ms-2">
                    Products
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-cart-fill"></i>

                <span class="menu-text ms-2">
                    Orders
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-bar-chart-fill"></i>

                <span class="menu-text ms-2">
                    Reports
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-gear-fill"></i>

                <span class="menu-text ms-2">
                    Settings
                </span>

            </a>


            <a href="#" class="nav-link">

                <i class="bi bi-box-arrow-right"></i>

                <span class="menu-text ms-2">
                    Logout
                </span>

            </a>

        </nav>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main id="mainContent" class="main-content">


        <!-- Top Navbar -->

        <nav class="navbar bg-white shadow-sm px-3">

            <div class="container-fluid">

                <!-- Sidebar Toggle -->
                <button
                    id="toggleButton"
                    class="btn btn-primary"
                    type="button"
                >

                    <i class="bi bi-list"></i>

                </button>


                <span class="navbar-brand fw-bold ms-3">

                    Dashboard

                </span>


                <!-- Profile -->
                <div class="ms-auto d-flex align-items-center">

                    <span class="me-3 text-secondary d-none d-sm-block">
                        Welcome, Admin
                    </span>

                    <div
                        class="bg-primary text-white rounded-circle
                               d-flex align-items-center justify-content-center"
                        style="width:40px;height:40px;"
                    >
                        <i class="bi bi-person-fill"></i>
                    </div>

                </div>

            </div>

        </nav>


        <!-- ================= PAGE CONTENT ================= -->

        <div class="container-fluid p-4">

            <h2 class="fw-bold mb-2">
                Dashboard
            </h2>

            <p class="text-secondary mb-4">
                Welcome to your admin dashboard.
            </p>


            <!-- Cards -->

            <div class="row g-4">


                <div class="col-12 col-md-6 col-xl-3">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body">

                            <i
                                class="bi bi-people-fill
                                       text-primary fs-1"
                            ></i>

                            <h6 class="text-secondary mt-3">
                                Total Users
                            </h6>

                            <h3 class="fw-bold">
                                1,250
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-12 col-md-6 col-xl-3">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body">

                            <i
                                class="bi bi-cart-check-fill
                                       text-success fs-1"
                            ></i>

                            <h6 class="text-secondary mt-3">
                                Orders
                            </h6>

                            <h3 class="fw-bold">
                                856
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-12 col-md-6 col-xl-3">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body">

                            <i
                                class="bi bi-box-seam-fill
                                       text-warning fs-1"
                            ></i>

                            <h6 class="text-secondary mt-3">
                                Products
                            </h6>

                            <h3 class="fw-bold">
                                320
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-12 col-md-6 col-xl-3">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body">

                            <i
                                class="bi bi-currency-rupee
                                       text-danger fs-1"
                            ></i>

                            <h6 class="text-secondary mt-3">
                                Revenue
                            </h6>

                            <h3 class="fw-bold">
                                ₹85,500
                            </h3>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Content -->

            <div class="card border-0 shadow-sm mt-4">

                <div class="card-body">

                    <h5 class="fw-bold">
                        Recent Activity
                    </h5>

                    <p class="text-secondary">
                        Your recent activities will appear here.
                    </p>

                    <button class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i>
                        Add New
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const sidebar =
            document.getElementById("sidebar");

        const mainContent =
            document.getElementById("mainContent");

        const toggleButton =
            document.getElementById("toggleButton");


        toggleButton.addEventListener("click", function () {

            if (window.innerWidth <= 767) {

                // Mobile sidebar
                sidebar.classList.toggle("mobile-show");

            } else {

                // Desktop sidebar
                sidebar.classList.toggle("collapsed");

                mainContent.classList.toggle("expanded");

            }

        });

    </script>

</body>

</html>
