<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9ecef;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 330px;
            background: #212529;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #f8f9fa;
            text-align: right;
            font-size: 30px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            background: #495057;
            color: white;
        }

        button:hover {
            background: #6c757d;
        }

        .operator {
            background: #0d6efd;
        }

        .operator:hover {
            background: #0b5ed7;
        }

        .clear {
            background: #dc3545;
        }

        .clear:hover {
            background: #bb2d3b;
        }

        .equal {
            background: #198754;
            grid-row: span 2;
            height: 130px;
        }

        .equal:hover {
            background: #157347;
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 92%;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="percentage()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        let firstNumber = "";
        let operator = "";
        let waitingForSecondNumber = false;


        // Add number to display
        function appendNumber(number) {

            if (waitingForSecondNumber) {
                display.value = number;
                waitingForSecondNumber = false;
                return;
            }

            if (number === "." && display.value.includes(".")) {
                return;
            }

            if (display.value === "0" && number !== ".") {
                display.value = number;
            } else {
                display.value += number;
            }
        }


        // Select operator
        function chooseOperator(selectedOperator) {

            firstNumber = parseFloat(display.value);

            operator = selectedOperator;

            waitingForSecondNumber = true;
        }


        // Calculate result
        function calculate() {

            if (operator === "" || waitingForSecondNumber) {
                return;
            }

            let secondNumber = parseFloat(display.value);

            let result;

            switch (operator) {

                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "*":
                    result = firstNumber * secondNumber;
                    break;

                case "/":

                    if (secondNumber === 0) {
                        display.value = "Error";
                        resetCalculator();
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;
            }

            display.value = result;

            operator = "";
            firstNumber = "";
        }


        // Clear calculator
        function clearDisplay() {

            display.value = "0";

            firstNumber = "";
            operator = "";
            waitingForSecondNumber = false;
        }


        // Delete last digit
        function deleteLast() {

            if (display.value.length === 1) {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }


        // Percentage
        function percentage() {

            let number = parseFloat(display.value);

            display.value = number / 100;
        }


        // Reset internal values
        function resetCalculator() {

            firstNumber = "";
            operator = "";
            waitingForSecondNumber = false;
        }

    </script>

</body>
</html>
