<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Modal Popup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            text-align: center;
            color: white;
        }

        h1 {
            margin-bottom: 15px;
        }

        .open-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        /* Modal Background */
        .modal {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.6);

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Modal Box */
        .modal-content {
            width: 100%;
            max-width: 450px;

            background: white;
            padding: 30px;

            border-radius: 18px;

            text-align: center;

            position: relative;

            animation: popup 0.3s ease;
        }

        @keyframes popup {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #666;
            line-height: 1.6;
        }

        /* Close X button */
        .close-btn {
            position: absolute;

            top: 12px;
            right: 18px;

            border: none;
            background: none;

            font-size: 30px;
            color: #777;

            cursor: pointer;
        }

        .close-btn:hover {
            color: #dc3545;
        }

        .okay-btn {
            margin-top: 20px;

            padding: 12px 25px;

            border: none;
            border-radius: 8px;

            background: #667eea;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .okay-btn:hover {
            background: #5568d9;
        }

        @media (max-width: 500px) {

            .modal-content {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Modal Popup</h1>

        <button class="open-btn" onclick="openModal()">
            Open Modal
        </button>

    </div>


    <!-- Modal -->

    <div id="myModal" class="modal">

        <div class="modal-content">

            <button class="close-btn" onclick="closeModal()">
                &times;
            </button>

            <div class="modal-icon">
                🎉
            </div>

            <h2>Welcome!</h2>

            <p>
                This is a modal popup created using
                HTML, CSS and JavaScript.
            </p>

            <button class="okay-btn" onclick="closeModal()">
                Okay
            </button>

        </div>

    </div>


    <script>

        // Open Modal
        function openModal() {

            document.getElementById("myModal").style.display = "flex";

        }


        // Close Modal
        function closeModal() {

            document.getElementById("myModal").style.display = "none";

        }


        // Close modal when clicking outside the modal box
        window.onclick = function(event) {

            const modal = document.getElementById("myModal");

            if (event.target === modal) {

                closeModal();

            }

        };


        // Close modal using Escape key
        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                closeModal();

            }

        });

    </script>

</body>
</html>
